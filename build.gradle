plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.github.rihyri'
version = '0.0.1-SNAPSHOT'

ext {
	set('springAiVersion', '1.1.8')
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {

	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	implementation 'org.mapstruct:mapstruct:1.5.5.Final'
	implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'

	implementation 'org.springframework.security:spring-security-crypto'

	// ========================================
	// Spring AI
	implementation 'org.springframework.ai:spring-ai-starter-model-google-genai-embedding'
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'

	// ===== 기존 PostgreSQL pgvector =====
	implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
	annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'

	// ===== 기존 PostgreSQL 드라이버 =====
	// runtimeOnly 'org.postgresql:postgresql'

	// ===== 기존 MariaDB 드라이버 =====
	// runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

	// ===== MySQL =====
	runtimeOnly 'com.mysql:mysql-connector-j'

	// Flyway (DB 마이그레이션)
	// Flyway 공통
	implementation 'org.flywaydb:flyway-core'

	// ===== 기존 PostgreSQL Flyway =====
	// implementation 'org.flywaydb:flyway-database-postgresql'

	// ===== MySQL / MariaDB Flyway =====
	implementation 'org.flywaydb:flyway-mysql'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Q클래스 생성 경로
def querydslDir = layout.buildDirectory.dir("generated/queryDsl")

tasks.withType(JavaCompile).configureEach {
	options.generatedSourceOutputDirectory.set(
			querydslDir.get().asFile
	)
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}