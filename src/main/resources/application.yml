server:
  port: 8087

spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  # Spring AI 설정
  ai:
    model:
      embedding: none

    openai:
      # Google AI Studio에서 발급한 API Key
      api-key: ${GEMINI_API_KEY}

      # Gemini OpenAI 호환 API
      base-url: https://generativelanguage.googleapis.com/v1beta/openai

      chat:
        completions-path: /chat/completions

        options:
          model: gemini-3.5-flash-lite
          temperature: 0.7
          max-tokens: 4096