server:
  port: 8087
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: til

  # ========================================
  # Database 설정
  # ========================================
  datasource:

    # ===== 기존 PostgreSQL 설정 =====
    # url: jdbc:postgresql://localhost:5432/sparta
    # username: postgres
    # password: postgres
    # driver-class-name: org.postgresql.Driver

    # ===== MySQL 8.0 설정 =====
    url: jdbc:mysql://localhost:3308/sparta?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ========================================
  # JPA 설정
  # ========================================
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:

        # ===== 기존 PostgreSQL =====
        # dialect: org.hibernate.dialect.PostgreSQLDialect

        # ===== MySQL =====
        dialect: org.hibernate.dialect.MySQL8Dialect

        format_sql: true

  # ========================================
  # Redis 설정
  # ========================================
  data:
    redis:
      host: localhost
      port: 6379
      password:
      # timeout: 1s
      # database: 0

  # ========================================
  # Flyway 설정
  # ========================================
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    driver-class-name: com.mysql.cj.jdbc.Driver

  ai:
    model:
      embedding:
        text: google-genai

    google:
      genai:
        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            options:
              model: gemini-embedding-001
              dimensions: 3072

    openai:
      api-key: ${GEMINI_API_KEY}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai

      chat:
        completions-path: /chat/completions

        options:
          model: gemini-3.5-flash-lite
          temperature: 0.7
          max-tokens: 4096

    # ===== 기존 PostgreSQL pgvector 설정 =====
    vectorstore:
      type: none

      # pgvector:
      #   enabled: false
      #   initialize-schema: false
      #   dimensions: 3072
      #   distance-type: COSINE_DISTANCE
      #   index-type: HNSW

# ========================================
# Logging 설정
# ========================================
logging:
  level:
    org.hibernate.SQL: DEBUG